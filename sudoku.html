<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Sudoku</title>
<style>
  :root{
    --bg:#eef1f6;
    --panel:#ffffff;
    --text:#1b2333;
    --muted:#5b6678;
    --line:#d5dbe6;
    --line-strong:#2c3648;
    --accent:#1d4ed8;
    --accent-solid:#1d4ed8;
    --accent-solid-hover:#1a45c2;
    --accent-soft:#dbe7ff;
    --peer:#f0f4fb;
    --same:#dbe7ff;
    --error:#b3261e;
    --error-soft:#ffe3e4;
    --given:#1b2333;
    --user:#1d4ed8;
    --hint:#0b6b3a;
    --shadow:0 10px 30px rgba(20,30,60,.10);
  }
  [data-theme="dark"]{
    --bg:#0d1220;
    --panel:#151c2c;
    --text:#e7ecf7;
    --muted:#8b97ad;
    --line:#26314a;
    --line-strong:#5d6d8c;
    --accent:#6ea8ff;
    --accent-solid:#2f6fed;
    --accent-solid-hover:#2a63d8;
    --accent-soft:#1d3355;
    --peer:#1a2334;
    --same:#1d3355;
    --error:#ff6b6b;
    --error-soft:#3a1d24;
    --given:#e7ecf7;
    --user:#7fb6ff;
    --hint:#4ade80;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
    display:flex;
    justify-content:center;
    padding:16px 14px 28px;
  }
  .app{width:100%;max-width:520px;min-width:0;display:flex;flex-direction:column;gap:14px}

  /* ---------- header ---------- */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .brand h1{margin:0;font-size:1.5rem;letter-spacing:-.02em;font-weight:700}
  .brand .sub{font-size:.8rem;color:var(--muted);font-weight:500}
  .stats{display:flex;gap:16px}
  .stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
  .stat .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .stat .v{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- board ---------- */
  .board-wrap{position:relative}
  .board{
    position:relative;
    display:flex;
    flex-direction:column;
    aspect-ratio:1/1;
    width:100%;
    background:var(--panel);
    border:2px solid var(--line-strong);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
    font-size:clamp(15px,4.6vw,30px);
    user-select:none;
    -webkit-user-select:none;
  }
  .board-row{display:grid;grid-template-columns:repeat(var(--n,9),minmax(0,1fr));flex:1;min-height:0}
  .board[data-size="4"]{font-size:clamp(30px,11vw,60px)}
  .board[data-size="6"]{font-size:clamp(22px,7vw,42px)}
  .cell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    cursor:pointer;
    font-size:1em;
    line-height:1;
    transition:background .12s ease,color .12s ease;
    overflow:hidden;
  }
  .cell.box-r{border-right:2px solid var(--line-strong)}
  .cell.box-b{border-bottom:2px solid var(--line-strong)}
  .cell.edge-r{border-right:0}
  .cell.edge-b{border-bottom:0}

  .cell.given{font-weight:700;color:var(--given)}
  .cell.user{font-weight:500;color:var(--user)}
  .cell.hint{font-weight:600;color:var(--hint)}
  .cell.peer{background:var(--peer)}
  .cell.same{background:var(--same)}
  .cell.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  .cell.error{color:var(--error);background:var(--error-soft)}
  .cell.error.selected{box-shadow:inset 0 0 0 2px var(--error)}
  @keyframes pop{from{transform:scale(.72);opacity:.4}to{transform:scale(1);opacity:1}}
  .cell:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--accent)}
  .cell.hint::after,
  .cell.error::after{
    position:absolute;top:1px;right:2px;
    font-size:max(8px,.24em);
    line-height:1;
    font-weight:700;
    pointer-events:none;
  }
  .cell.hint::after{content:'★';color:var(--hint)}
  .cell.error::after{content:'✕';color:var(--error)}

  .notes{
    display:grid;
    grid-template-columns:repeat(var(--notes-cols,3),1fr);
    grid-template-rows:repeat(var(--notes-rows,3),1fr);
    width:100%;height:100%;
    padding:2px;
    font-size:.34em;
    font-weight:600;
    color:var(--muted);
    line-height:1;
  }
  .notes span{display:flex;align-items:center;justify-content:center}

  /* ---------- overlay ---------- */
  .overlay{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,28,45,.45);
    background:color-mix(in srgb,var(--bg) 72%,transparent);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    z-index:50;
    padding:18px;
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .overlay[hidden]{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 20px;
    text-align:center;
    box-shadow:var(--shadow);
    max-width:320px;
    width:100%;
  }
  .overlay-card h2{margin:0 0 6px;font-size:1.25rem}
  .overlay-card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}
  .overlay-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .spinner{
    width:26px;height:26px;margin:14px auto 0;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- number pad ---------- */
  .pad{display:grid;grid-template-columns:repeat(var(--n,9),minmax(0,1fr));gap:5px}
  .pad[data-size="4"]{gap:10px}
  .pad[data-size="6"]{gap:7px}
  .pad[data-size="4"] .pad-btn{aspect-ratio:1/0.7;font-size:1.6rem}
  .pad[data-size="6"] .pad-btn{aspect-ratio:1/0.95;font-size:1.3rem}
  .pad-btn{
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;
    aspect-ratio:1/1.18;
    padding:0;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel);
    color:var(--accent);
    font-family:inherit;
    font-size:clamp(1rem,4.4vw,1.35rem);
    font-weight:700;
    cursor:pointer;
    transition:transform .08s,background .12s,border-color .12s,opacity .12s;
  }
  .pad-btn:active{transform:scale(.94)}
  .pad-btn .cnt{font-size:.5em;font-weight:600;color:var(--muted);line-height:1;min-height:.6em}
  .pad-btn.done{opacity:.32;pointer-events:none}

  /* ---------- actions ---------- */
  .actions{display:grid;grid-template-columns:repeat(var(--actions,4),minmax(0,1fr));gap:8px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 10px;
    border:1px solid var(--line);
    border-radius:11px;
    background:var(--panel);
    color:var(--text);
    font-family:inherit;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    transition:background .12s,border-color .12s,transform .08s,color .12s;
    white-space:normal;
    min-width:0;
    overflow-wrap:break-word;
    line-height:1.25;
  }
  .btn:active{transform:scale(.97)}
  .btn .ico{font-size:1rem;line-height:1}
  .btn .label{min-width:0;overflow-wrap:break-word;hyphens:auto}
  .btn.active{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
  .btn.primary{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
  .btn:disabled{opacity:.4;pointer-events:none}

  @media (hover:hover) and (pointer:fine){
    .pad-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
    .btn:hover{background:var(--peer);border-color:var(--line-strong)}
    .btn.primary:hover,.btn.active:hover{background:var(--accent-solid-hover);border-color:var(--accent-solid-hover);color:#fff}
  }

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:8px;align-items:center;min-width:0}
  .select{
    flex:1;
    min-width:0;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:11px;
    background:var(--panel);
    color:var(--text);
    font-family:inherit;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;
    padding-right:34px;
  }
  .toolbar .btn{flex:0 0 auto}
  .toolbar .btn.primary{flex:1}
  .icon-btn{
    width:44px;padding:11px 0;
    font-size:1.05rem;
  }

  .foot{text-align:center;font-size:.7rem;color:var(--muted);margin-top:-2px}
  .foot kbd{
    font-family:inherit;font-size:.95em;
    background:var(--panel);border:1px solid var(--line);
    border-radius:4px;padding:1px 4px;
  }

  /* ---------- Kinder-Design ---------- */
  [data-kid="true"]{
    --bg:#fff4e2;
    --panel:#fffdf7;
    --text:#3a2b1d;
    --muted:#7d5f45;
    --line:#f0dcc0;
    --line-strong:#c9a276;
    --accent:#a84f00;
    --accent-solid:#a84f00;
    --accent-solid-hover:#b35400;
    --accent-soft:#ffe6c2;
    --peer:#fff1dc;
    --same:#ffdfae;
    --error:#b3261e;
    --error-soft:#ffe0e1;
    --given:#4a3524;
    --user:#a84f00;
    --hint:#0b6b3a;
    --shadow:0 12px 30px rgba(160,110,50,.16);
  }
  [data-kid="true"][data-theme="dark"]{
    --bg:#211a14;
    --panel:#2c231a;
    --text:#f6e8d6;
    --muted:#b39a80;
    --line:#423528;
    --line-strong:#7a6144;
    --accent:#ffb056;
    --accent-solid:#a84f00;
    --accent-solid-hover:#b35400;
    --accent-soft:#4a3418;
    --peer:#33291e;
    --same:#4a3418;
    --error:#ff8080;
    --error-soft:#4a2222;
    --given:#f6e8d6;
    --user:#ffc27a;
    --hint:#6ee7a0;
    --shadow:0 12px 30px rgba(0,0,0,.5);
  }
  [data-kid="true"] .board,
  [data-kid="true"] .btn,
  [data-kid="true"] .pad-btn,
  [data-kid="true"] .select,
  [data-kid="true"] .overlay-card{
    border-radius:18px;
  }
  [data-kid="true"] .brand h1{font-size:1.65rem}
  [data-kid="true"] .cell{font-weight:700}

  @media (max-width:400px){
    .btn{font-size:.72rem;padding:10px 4px;gap:0}
    .btn .ico{display:none}
    .actions{gap:6px}
    .pad{gap:4px}
    .foot{font-size:.64rem}
  }

  @media (prefers-reduced-motion: no-preference){
    body{transition:background .2s,color .2s}
    .cell.pop{animation:pop .18s ease}
    .overlay{animation:fade .18s ease}
    .spinner{animation:spin .8s linear infinite}
  }
  @media (prefers-reduced-motion: reduce){
    body,.cell,.btn,.pad-btn,.select{transition:none}
  }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand">
      <h1 id="title">Sudoku</h1>
      <span class="sub" id="sub">Mittel</span>
    </div>
    <div class="stats">
      <div class="stat" id="stat-time"><span class="k">Zeit</span><span class="v" id="timer">00:00</span></div>
      <div class="stat" id="stat-mistakes"><span class="k">Fehler</span><span class="v" id="mistakes">0/3</span></div>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="pad" id="pad"></div>

  <div class="actions" id="actions">
    <button class="btn" id="btn-notes"><span class="ico">✎</span><span class="label">Notizen</span></button>
    <button class="btn" id="btn-undo"><span class="ico">↶</span><span class="label">Undo</span></button>
    <button class="btn" id="btn-hint"><span class="ico">✦</span><span class="label">Tipp</span></button>
    <button class="btn" id="btn-erase"><span class="ico">⌫</span><span class="label">Löschen</span></button>
  </div>

  <div class="toolbar">
    <select class="select" id="variant" aria-label="Spielvariante"></select>
    <button class="btn primary" id="new-game">Neues Spiel</button>
    <button class="btn icon-btn" id="theme" title="Design wechseln" aria-label="Design wechseln">◐</button>
  </div>

  <div class="foot" id="foot">
    Tasten: <kbd>1</kbd>–<kbd>9</kbd> setzen · <kbd>0</kbd> löschen · <kbd>N</kbd> Notizen · <kbd>H</kbd> Tipp · <kbd>Strg</kbd>+<kbd>Z</kbd> Undo
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title" aria-describedby="ov-text" tabindex="-1" hidden>
  <div class="overlay-card">
    <h2 id="ov-title"></h2>
    <p id="ov-text"></p>
    <div class="overlay-actions" id="ov-actions"></div>
  </div>
</div>
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'sudoku.v1';
  var MAX_MISTAKES = 3;
  var VARIANTS = {
    kind4:      { group: 'Kinder',    label: 'Kind 4×4',    size: 4, boxRows: 2, boxCols: 2, givens: 9,  kid: true,  notes: false, showMistakes: false, showTimer: false, strict: false },
    kind6:      { group: 'Kinder',    label: 'Kind 6×6',    size: 6, boxRows: 2, boxCols: 3, givens: 20, kid: true,  notes: true,  showMistakes: false, showTimer: false, strict: false },
    sehrleicht: { group: 'Klassisch', label: 'Sehr leicht', size: 9, boxRows: 3, boxCols: 3, givens: 50, kid: false, notes: true,  showMistakes: true,  showTimer: true,  strict: false },
    leicht:     { group: 'Klassisch', label: 'Leicht',      size: 9, boxRows: 3, boxCols: 3, givens: 40, kid: false, notes: true,  showMistakes: true,  showTimer: true,  strict: true },
    mittel:     { group: 'Klassisch', label: 'Mittel',      size: 9, boxRows: 3, boxCols: 3, givens: 34, kid: false, notes: true,  showMistakes: true,  showTimer: true,  strict: true },
    schwer:     { group: 'Klassisch', label: 'Schwer',      size: 9, boxRows: 3, boxCols: 3, givens: 29, kid: false, notes: true,  showMistakes: true,  showTimer: true,  strict: true },
    extrem:     { group: 'Klassisch', label: 'Extrem',      size: 9, boxRows: 3, boxCols: 3, givens: 25, kid: false, notes: true,  showMistakes: true,  showTimer: true,  strict: true }
  };

  /* ================= Sudoku-Kern ================= */

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function candidates(b, size, boxRows, boxCols, i) {
    var r = (i / size) | 0, c = i % size;
    var used = 0, k, dr, dc;
    for (k = 0; k < size; k++) {
      used |= 1 << b[r * size + k];
      used |= 1 << b[k * size + c];
    }
    var br = r - (r % boxRows), bc = c - (c % boxCols);
    for (dr = 0; dr < boxRows; dr++) {
      for (dc = 0; dc < boxCols; dc++) used |= 1 << b[(br + dr) * size + bc + dc];
    }
    var out = [];
    for (var n = 1; n <= size; n++) if (!(used & (1 << n))) out.push(n);
    return out;
  }

  function generateSolution(size, boxRows, boxCols) {
    var total = size * size;
    var b = new Array(total).fill(0);
    function rec() {
      var best = -1, bestC = null, i, c;
      for (i = 0; i < total; i++) {
        if (b[i] !== 0) continue;
        c = candidates(b, size, boxRows, boxCols, i);
        if (c.length === 0) return false;
        if (bestC === null || c.length < bestC.length) {
          best = i; bestC = c;
          if (c.length === 1) break;
        }
      }
      if (best === -1) return true;
      shuffle(bestC);
      for (var k = 0; k < bestC.length; k++) {
        b[best] = bestC[k];
        if (rec()) return true;
        b[best] = 0;
      }
      return false;
    }
    rec();
    return b;
  }

  function countSolutions(board, limit, size, boxRows, boxCols) {
    var total = size * size;
    var b = board.slice();
    var count = 0;
    function rec() {
      var best = -1, bestC = null, i, c;
      for (i = 0; i < total; i++) {
        if (b[i] !== 0) continue;
        c = candidates(b, size, boxRows, boxCols, i);
        if (c.length === 0) return;
        if (bestC === null || c.length < bestC.length) {
          best = i; bestC = c;
          if (c.length === 1) break;
        }
      }
      if (best === -1) { count++; return; }
      for (var k = 0; k < bestC.length; k++) {
        b[best] = bestC[k];
        rec();
        b[best] = 0;
        if (count >= limit) return;
      }
    }
    rec();
    return count;
  }

  function makePuzzle(variant) {
    var total = variant.size * variant.size;
    var solution = generateSolution(variant.size, variant.boxRows, variant.boxCols);
    var puzzle = solution.slice();
    var target = variant.givens;
    var order = shuffle(Array.from({ length: total }, function (_, i) { return i; }));
    var givens = total;
    for (var k = 0; k < order.length && givens > target; k++) {
      var i = order[k];
      var backup = puzzle[i];
      puzzle[i] = 0;
      if (countSolutions(puzzle, 2, variant.size, variant.boxRows, variant.boxCols) !== 1) puzzle[i] = backup;
      else givens--;
    }
    return { puzzle: puzzle, solution: solution };
  }

  /* ================= Zustand ================= */

  var state = null;
  var timerId = null;
  var gameTimerId = null;
  var gameRequestSeq = 0;
  var overlayOpen = false;
  var lastFocused = null;

  function currentVariant() {
    return VARIANTS[state && state.variant] || VARIANTS.mittel;
  }

  function blockId(r, c, variant) {
    return Math.floor(r / variant.boxRows) * (variant.size / variant.boxCols) +
      Math.floor(c / variant.boxCols);
  }

  function blankState(variantKey, puzzle, solution) {
    var key = VARIANTS[variantKey] ? variantKey : 'mittel';
    var variant = VARIANTS[key];
    var total = variant.size * variant.size;
    return {
      variant: key,
      puzzle: puzzle,
      solution: solution,
      grid: puzzle.slice(),
      notes: Array.from({ length: total }, function () { return []; }),
      errors: new Array(total).fill(false),
      hints: new Array(total).fill(false),
      selected: null,
      notesMode: false,
      mistakes: 0,
      maxMistakes: variant.strict ? MAX_MISTAKES : null,
      seconds: 0,
      done: false,
      over: false,
      history: []
    };
  }

  /* ================= DOM ================= */

  var appEl = document.querySelector('.app');
  var boardEl = document.getElementById('board');
  var padEl = document.getElementById('pad');
  var timerEl = document.getElementById('timer');
  var mistakesEl = document.getElementById('mistakes');
  var subEl = document.getElementById('sub');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovText = document.getElementById('ov-text');
  var ovActions = document.getElementById('ov-actions');
  var variantSel = document.getElementById('variant');
  var statTimeEl = document.getElementById('stat-time');
  var statMistakesEl = document.getElementById('stat-mistakes');
  var footEl = document.getElementById('foot');
  var titleEl = document.getElementById('title');
  var actionsEl = document.getElementById('actions');
  var liveEl = document.getElementById('live');
  var notesBtn = document.getElementById('btn-notes');
  var undoBtn = document.getElementById('btn-undo');
  var hintBtn = document.getElementById('btn-hint');
  var eraseBtn = document.getElementById('btn-erase');
  var newBtn = document.getElementById('new-game');
  var themeBtn = document.getElementById('theme');

  var cells = [];
  var padButtons = [];

  function buildBoard(size) {
    boardEl.innerHTML = '';
    boardEl.setAttribute('role', 'grid');
    boardEl.setAttribute('aria-rowcount', String(size));
    boardEl.setAttribute('aria-colcount', String(size));
    cells = [];
    for (var r = 0; r < size; r++) {
      var row = document.createElement('div');
      row.className = 'board-row';
      row.setAttribute('role', 'row');
      row.setAttribute('aria-rowindex', String(r + 1));
      for (var c = 0; c < size; c++) {
        (function (idx, rowIndex, colIndex) {
          var d = document.createElement('div');
          d.className = 'cell';
          d.dataset.i = String(idx);
          d.dataset.r = String(rowIndex);
          d.dataset.c = String(colIndex);
          d.setAttribute('role', 'gridcell');
          d.setAttribute('aria-colindex', String(colIndex + 1));
          d.setAttribute('aria-label', 'Zeile ' + (rowIndex + 1) + ', Spalte ' + (colIndex + 1));
          d.setAttribute('tabindex', '-1');
          d.addEventListener('click', function () {
            if (!state || state.done || state.over) return;
            state.selected = idx;
            render();
            d.focus();
            announce(cellLabel(idx));
          });
          d.addEventListener('focus', function () {
            if (!state || state.done || state.over) return;
            if (state.selected !== idx) {
              state.selected = idx;
              render();
            }
          });
          row.appendChild(d);
          cells.push(d);
        })(r * size + c, r, c);
      }
      boardEl.appendChild(row);
    }
    if (cells[0]) cells[0].setAttribute('tabindex', '0');
  }

  function buildPad(size) {
    padEl.innerHTML = '';
    padButtons = [];
    padEl.dataset.size = String(size);
    padEl.style.setProperty('--n', String(size));
    for (var n = 1; n <= size; n++) {
      (function (num) {
        var b = document.createElement('button');
        b.className = 'pad-btn';
        b.type = 'button';
        b.innerHTML = '<span class="num">' + num + '</span><span class="cnt"></span>';
        b.addEventListener('click', function () { inputNumber(num); });
        padEl.appendChild(b);
        padButtons.push(b);
      })(n);
    }
  }

  /* ================= Rendering ================= */

  function notesHTML(notes, size) {
    var set = {};
    for (var k = 0; k < notes.length; k++) set[notes[k]] = true;
    var h = '<div class="notes" aria-hidden="true">';
    for (var n = 1; n <= size; n++) h += '<span>' + (set[n] ? n : '') + '</span>';
    return h + '</div>';
  }

  function cellLabel(i) {
    var size = currentVariant().size;
    var r = (i / size) | 0, c = i % size;
    var base = 'Zeile ' + (r + 1) + ', Spalte ' + (c + 1);
    var value = state.grid[i];
    if (state.puzzle[i] !== 0) return base + ', Vorgabe ' + value;
    if (state.errors[i]) return base + ', falsch: ' + value;
    if (state.hints[i]) return base + ', Tipp: ' + value;
    if (value) return base + ', ' + value;
    if (state.notes[i].length) return base + ', leer, Notizen ' + state.notes[i].join(' ');
    return base + ', leer';
  }

  function announce(message) {
    if (liveEl) liveEl.textContent = message;
  }

  function render() {
    if (!state) return;
    var variant = currentVariant();
    var size = variant.size;
    var total = size * size;
    var sel = state.selected;
    var selVal = sel !== null ? state.grid[sel] : 0;
    var selR = sel !== null ? (sel / size) | 0 : -1;
    var selC = sel !== null ? sel % size : -1;
    var selB = sel !== null ? blockId(selR, selC, variant) : -1;

    for (var i = 0; i < total; i++) {
      var el = cells[i];
      var v = state.grid[i];
      var r = (i / size) | 0, c = i % size;
      var b = blockId(r, c, variant);
      var cls = 'cell';

      if (state.puzzle[i] !== 0) cls += ' given';
      else if (state.hints[i]) cls += ' hint';
      else if (v !== 0) cls += ' user';

      if (state.errors[i]) cls += ' error';
      if (sel === i) cls += ' selected';
      else if (sel !== null && (r === selR || c === selC || b === selB)) cls += ' peer';
      if (selVal && v === selVal && sel !== i) cls += ' same';

      if ((c + 1) % variant.boxCols === 0) cls += ' box-r';
      if ((r + 1) % variant.boxRows === 0) cls += ' box-b';
      if (c === size - 1) cls += ' edge-r';
      if (r === size - 1) cls += ' edge-b';

      if (el.className !== cls) el.className = cls;

      el.setAttribute('aria-label', cellLabel(i));
      el.setAttribute('aria-readonly', state.puzzle[i] !== 0 ? 'true' : 'false');
      if (state.errors[i]) el.setAttribute('aria-invalid', 'true');
      else el.removeAttribute('aria-invalid');
      el.setAttribute('aria-selected', sel === i ? 'true' : 'false');
      var tab = (sel === i || (sel === null && i === 0)) ? '0' : '-1';
      if (el.getAttribute('tabindex') !== tab) el.setAttribute('tabindex', tab);

      // Inhalt immer über den vollständigen Markup-String vergleichen:
      // sonst bleibt bei einer einzelnen Notiz, die zufällig der eingegebenen
      // Zahl entspricht, das Notiz-Raster im DOM stehen (Zahl wirkt winzig).
      var want = v !== 0
        ? String(v)
        : (state.notes[i].length ? notesHTML(state.notes[i], size) : '');
      if (el.innerHTML !== want) el.innerHTML = want;
    }

    var counts = new Array(size + 1).fill(0);
    for (var g = 0; g < total; g++) if (state.grid[g]) counts[state.grid[g]]++;
    for (var n = 1; n <= size; n++) {
      var left = size - counts[n];
      var btn = padButtons[n - 1];
      var cntEl = btn.querySelector('.cnt');
      var txt = left > 0 ? String(left) : '';
      if (cntEl.textContent !== txt) cntEl.textContent = txt;
      btn.classList.toggle('done', left <= 0);
    }

    notesBtn.classList.toggle('active', state.notesMode);
    undoBtn.disabled = state.history.length === 0;
    subEl.textContent = variant.label;
    mistakesEl.textContent = state.maxMistakes === null
      ? String(state.mistakes)
      : state.mistakes + '/' + state.maxMistakes;
    updateTimer();
  }

  function fmtTime(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var mm = (h > 0 && m < 10 ? '0' : '') + m;
    var ss = (sec < 10 ? '0' : '') + sec;
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }

  function updateTimer() {
    timerEl.textContent = fmtTime(state ? state.seconds : 0);
  }

  /* ================= Overlay ================= */

  function showOverlay(title, text, buttons, loading) {
    ovTitle.textContent = title;
    ovText.textContent = text || '';
    ovText.hidden = !text;
    ovActions.innerHTML = '';
    if (loading) {
      var sp = document.createElement('div');
      sp.className = 'spinner';
      ovActions.appendChild(sp);
    }

    var firstAction = null;
    (buttons || []).forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn' + (b.primary ? ' primary' : '');
      el.textContent = b.label;
      el.addEventListener('click', b.onClick);
      ovActions.appendChild(el);
      if (!firstAction) firstAction = el;
    });

    if (!overlayOpen) lastFocused = document.activeElement;
    overlayOpen = true;
    appEl.setAttribute('inert', '');
    overlay.setAttribute('aria-busy', loading ? 'true' : 'false');
    overlay.hidden = false;
    requestAnimationFrame(function () {
      if (!overlayOpen) return;
      if (firstAction) firstAction.focus();
      else overlay.focus();
    });
  }

  function hideOverlay() {
    if (overlay.hidden) return;
    overlay.hidden = true;
    overlayOpen = false;
    overlay.removeAttribute('aria-busy');
    appEl.removeAttribute('inert');
    var target = lastFocused;
    lastFocused = null;
    if (target && document.contains(target) && typeof target.focus === 'function') target.focus();
    else if (cells[0]) cells[0].focus();
  }

  /* ================= Spiel-Logik ================= */

  function pushHistory() {
    state.history.push({
      grid: state.grid.slice(),
      notes: state.notes.map(function (a) { return a.slice(); }),
      errors: state.errors.slice(),
      hints: state.hints.slice(),
      mistakes: state.mistakes
    });
    if (state.history.length > 300) state.history.shift();
  }

  function removeNote(i, n) {
    var a = state.notes[i];
    var idx = a.indexOf(n);
    if (idx >= 0) a.splice(idx, 1);
  }

  function clearPeerNotes(i, n) {
    var variant = currentVariant();
    var size = variant.size;
    var r = (i / size) | 0, c = i % size;
    var br = r - (r % variant.boxRows), bc = c - (c % variant.boxCols);
    for (var k = 0; k < size; k++) {
      removeNote(r * size + k, n);
      removeNote(k * size + c, n);
    }
    for (var dr = 0; dr < variant.boxRows; dr++) {
      for (var dc = 0; dc < variant.boxCols; dc++) removeNote((br + dr) * size + bc + dc, n);
    }
  }

  function inputNumber(n) {
    if (!state || state.done || state.over) return;
    var variant = currentVariant();
    if (n < 1 || n > variant.size) return;
    var i = state.selected;
    if (i === null || state.puzzle[i] !== 0) return;

    if (state.notesMode) {
      if (!variant.notes || state.grid[i] !== 0) return;
      pushHistory();
      var arr = state.notes[i];
      var idx = arr.indexOf(n);
      if (idx >= 0) arr.splice(idx, 1);
      else { arr.push(n); arr.sort(); }
      save(); render();
      announce(cellLabel(i) + (idx >= 0 ? ', Notiz entfernt' : ', Notiz hinzugefügt'));
      return;
    }

    if (state.grid[i] === n) {
      pushHistory();
      state.grid[i] = 0;
      state.errors[i] = false;
      save(); render();
      announce(cellLabel(i));
      return;
    }

    pushHistory();
    state.grid[i] = n;
    state.notes[i] = [];
    state.hints[i] = false;

    if (n !== state.solution[i]) {
      state.errors[i] = true;
      state.mistakes++;
      if (state.maxMistakes !== null && state.mistakes >= state.maxMistakes) {
        state.over = true;
        save(); render();
        showOverlay('Game Over', 'Du hast ' + state.maxMistakes + ' Fehler gemacht.', [
          { label: 'Neues Spiel', primary: true, onClick: function () { startNewGame(state.variant); } },
          { label: 'Weiterspielen', onClick: function () {
              state.over = false;
              state.mistakes = 0;
              hideOverlay();
              save(); render();
            } }
        ]);
        return;
      }
    } else {
      state.errors[i] = false;
      clearPeerNotes(i, n);
    }

    save(); render();
    announce(cellLabel(i));
    var placed = cells[i];
    placed.classList.remove('pop');
    void placed.offsetWidth;
    placed.classList.add('pop');
    checkWin();
  }

  function eraseCell() {
    if (!state || state.done || state.over) return;
    var i = state.selected;
    if (i === null || state.puzzle[i] !== 0) return;
    if (state.grid[i] === 0 && state.notes[i].length === 0) return;
    pushHistory();
    state.grid[i] = 0;
    state.notes[i] = [];
    state.errors[i] = false;
    state.hints[i] = false;
    save(); render();
    announce(cellLabel(i));
  }

  function undo() {
    if (!state || state.done || state.over) return;
    var h = state.history.pop();
    if (!h) return;
    state.grid = h.grid;
    state.notes = h.notes;
    state.errors = h.errors;
    state.hints = h.hints;
    state.mistakes = h.mistakes;
    save(); render();
    announce('Zug rückgängig');
  }

  function hint() {
    if (!state || state.done || state.over) return;
    var i = state.selected;
    if (i === null || state.grid[i] !== 0 || state.puzzle[i] !== 0) {
      var total = currentVariant().size * currentVariant().size;
      var empties = [];
      for (var k = 0; k < total; k++) if (state.grid[k] === 0) empties.push(k);
      if (!empties.length) return;
      i = empties[Math.floor(Math.random() * empties.length)];
      state.selected = i;
    }
    pushHistory();
    state.grid[i] = state.solution[i];
    state.notes[i] = [];
    state.errors[i] = false;
    state.hints[i] = true;
    clearPeerNotes(i, state.solution[i]);
    save(); render();
    announce(cellLabel(i));
    checkWin();
  }

  function checkWin() {
    var variant = currentVariant();
    var total = variant.size * variant.size;
    for (var i = 0; i < total; i++) {
      if (state.grid[i] !== state.solution[i]) return;
    }
    state.done = true;
    stopTimer();
    save(); render();
    var text = 'Zeit: ' + fmtTime(state.seconds) + ' · ' + variant.label;
    if (!variant.kid) {
      text += state.mistakes ? ' · ' + state.mistakes + ' Fehler' : ' · fehlerfrei';
    }
    showOverlay(
      variant.kid ? 'Super gemacht! ⭐' : 'Gelöst! 🎉',
      text,
      [{ label: 'Neues Spiel', primary: true, onClick: function () { startNewGame(state.variant); } }]
    );
  }

  /* ================= Timer ================= */

  function startTimer() {
    stopTimer();
    timerId = setInterval(function () {
      if (!state || state.done || state.over) return;
      state.seconds++;
      updateTimer();
      if (state.seconds % 5 === 0) save();
    }, 1000);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  /* ================= Persistenz ================= */

  function save() {
    if (!state) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        v: 1,
        variant: state.variant,
        puzzle: state.puzzle,
        solution: state.solution,
        grid: state.grid,
        notes: state.notes,
        errors: state.errors,
        hints: state.hints,
        mistakes: state.mistakes,
        seconds: state.seconds,
        done: state.done,
        over: state.over
      }));
    } catch (e) { /* Speicher nicht verfügbar */ }
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d) return null;
      var key = d.variant || d.difficulty || 'mittel';
      if (!VARIANTS[key]) key = 'mittel';
      var variant = VARIANTS[key];
      var total = variant.size * variant.size;
      if (!Array.isArray(d.puzzle) || d.puzzle.length !== total) return null;
      if (!Array.isArray(d.solution) || d.solution.length !== total) return null;
      var s = blankState(key, d.puzzle, d.solution);
      s.grid = Array.isArray(d.grid) && d.grid.length === total ? d.grid : d.puzzle.slice();
      s.notes = Array.isArray(d.notes) && d.notes.length === total
        ? d.notes.map(function (a) { return Array.isArray(a) ? a.slice() : []; })
        : s.notes;
      s.errors = Array.isArray(d.errors) && d.errors.length === total ? d.errors : s.errors;
      s.hints = Array.isArray(d.hints) && d.hints.length === total ? d.hints : s.hints;
      s.mistakes = typeof d.mistakes === 'number' ? d.mistakes : 0;
      s.seconds = typeof d.seconds === 'number' ? d.seconds : 0;
      s.done = !!d.done;
      s.over = !!d.over;
      return s;
    } catch (e) { return null; }
  }

  /* ================= Neues Spiel ================= */

  function applyVariantUI(variantKey) {
    var variant = VARIANTS[variantKey] || VARIANTS.mittel;
    if (variant.kid) document.documentElement.setAttribute('data-kid', 'true');
    else document.documentElement.removeAttribute('data-kid');

    titleEl.textContent = variant.kid ? 'Sudoku Kids' : 'Sudoku';
    statTimeEl.hidden = !variant.showTimer;
    statMistakesEl.hidden = !variant.showMistakes;
    notesBtn.hidden = !variant.notes;
    footEl.hidden = !!variant.kid;

    notesBtn.querySelector('.label').textContent = variant.kid ? 'Merkzettel' : 'Notizen';
    eraseBtn.querySelector('.label').textContent = variant.kid ? 'Radierer' : 'Löschen';
    actionsEl.style.setProperty('--actions', variant.notes ? '4' : '3');

    boardEl.style.setProperty('--n', String(variant.size));
    boardEl.style.setProperty('--notes-cols', String(variant.boxCols));
    boardEl.style.setProperty('--notes-rows', String(Math.ceil(variant.size / variant.boxCols)));
    boardEl.dataset.size = String(variant.size);
    boardEl.setAttribute('aria-label', 'Sudoku ' + variant.label);

    if (!variant.notes && state) state.notesMode = false;
  }

  function buildVariantSelect() {
    var groups = {};
    var order = [];
    Object.keys(VARIANTS).forEach(function (key) {
      var group = VARIANTS[key].group;
      if (!groups[group]) { groups[group] = []; order.push(group); }
      groups[group].push(key);
    });
    variantSel.innerHTML = '';
    order.forEach(function (group) {
      var og = document.createElement('optgroup');
      og.label = group;
      groups[group].forEach(function (key) {
        var opt = document.createElement('option');
        opt.value = key;
        opt.textContent = VARIANTS[key].label;
        og.appendChild(opt);
      });
      variantSel.appendChild(og);
    });
  }

  function startNewGame(variantKey) {
    variantKey = VARIANTS[variantKey] ? variantKey : 'mittel';
    variantSel.value = variantKey;

    // Eine noch laufende Generierung abbrechen: schnelles Umschalten soll
    // nicht mehrere Rätsel parallel erzeugen. Die Sequenznummer fängt auch
    // bereits eingereihte Timer-Callbacks ab.
    gameRequestSeq++;
    var requestSeq = gameRequestSeq;
    if (gameTimerId !== null) {
      clearTimeout(gameTimerId);
      gameTimerId = null;
    }

    showOverlay('Neues Spiel', 'Sudoku wird generiert …', [], true);
    gameTimerId = setTimeout(function () {
      gameTimerId = null;
      if (requestSeq !== gameRequestSeq) return;
      var variant = VARIANTS[variantKey];
      var made = makePuzzle(variant);
      state = blankState(variantKey, made.puzzle, made.solution);
      applyVariantUI(variantKey);
      buildBoard(variant.size);
      buildPad(variant.size);
      hideOverlay();
      save();
      render();
      announce('Neues Spiel: ' + variant.label);
      startTimer();
    }, 40);
  }

  /* ================= Events ================= */

  notesBtn.addEventListener('click', function () {
    if (!state || state.done || state.over) return;
    if (!currentVariant().notes) return;
    state.notesMode = !state.notesMode;
    render();
    announce(state.notesMode ? 'Notizenmodus an' : 'Notizenmodus aus');
  });

  undoBtn.addEventListener('click', undo);
  hintBtn.addEventListener('click', hint);
  eraseBtn.addEventListener('click', eraseCell);

  function hasProgress() {
    if (!state) return false;
    if (state.history.length > 0) return true;
    var total = currentVariant().size * currentVariant().size;
    for (var i = 0; i < total; i++) if (state.grid[i] !== state.puzzle[i]) return true;
    return false;
  }

  function requestNewGame(variantKey) {
    if (!state || state.done || state.over || !hasProgress()) {
      startNewGame(variantKey);
      return;
    }
    showOverlay('Neues Spiel?', 'Dein aktueller Fortschritt geht verloren.', [
      { label: 'Neues Spiel starten', primary: true, onClick: function () { startNewGame(variantKey); } },
      { label: 'Abbrechen', onClick: function () { variantSel.value = state.variant; hideOverlay(); variantSel.focus(); } }
    ]);
  }

  newBtn.addEventListener('click', function () {
    requestNewGame(variantSel.value);
  });

  variantSel.addEventListener('change', function () {
    requestNewGame(variantSel.value);
  });

  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('sudoku.theme', next); } catch (e) {}
  });

  overlay.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || !overlayOpen) return;
    var buttons = ovActions.querySelectorAll('button');
    if (!buttons.length) {
      e.preventDefault();
      overlay.focus();
      return;
    }
    var first = buttons[0], last = buttons[buttons.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!state) return;

    if (e.key === 'Escape' && overlayOpen) {
      e.preventDefault();
      var cancel = null;
      var buttons = ovActions.querySelectorAll('button');
      for (var k = 0; k < buttons.length; k++) {
        var label = buttons[k].textContent;
        if (label === 'Abbrechen' || label === 'Weiterspielen' || label === 'Schließen') {
          cancel = buttons[k];
          break;
        }
      }
      if (cancel) cancel.click();
      else if (overlay.getAttribute('aria-busy') !== 'true') hideOverlay();
      return;
    }

    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.key >= '1' && e.key <= '9') {
      e.preventDefault();
      inputNumber(parseInt(e.key, 10));
      return;
    }
    if (e.key === '0' || e.key === 'Backspace' || e.key === 'Delete') {
      e.preventDefault();
      eraseCell();
      return;
    }
    if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      notesBtn.click();
      return;
    }
    if (e.key === 'h' || e.key === 'H') {
      e.preventDefault();
      hint();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      undo();
      return;
    }
    if (e.key.indexOf('Arrow') === 0) {
      e.preventDefault();
      var i = state.selected;
      if (i === null) {
        state.selected = 0;
        render();
        if (cells[0]) cells[0].focus();
        return;
      }
      var size = currentVariant().size;
      var r = (i / size) | 0, c = i % size;
      if (e.key === 'ArrowUp') r = (r + size - 1) % size;
      if (e.key === 'ArrowDown') r = (r + 1) % size;
      if (e.key === 'ArrowLeft') c = (c + size - 1) % size;
      if (e.key === 'ArrowRight') c = (c + 1) % size;
      state.selected = r * size + c;
      render();
      if (cells[state.selected]) cells[state.selected].focus();
    }
  });

  /* ================= Start ================= */

  (function init() {
    buildVariantSelect();

    var savedTheme = null;
    try { savedTheme = localStorage.getItem('sudoku.theme'); } catch (e) {}
    if (!savedTheme) {
      savedTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', savedTheme);

    var loaded = load();
    if (loaded) {
      state = loaded;
      applyVariantUI(state.variant);
      buildBoard(currentVariant().size);
      buildPad(currentVariant().size);
      variantSel.value = state.variant;
      render();
      if (state.done) {
        showOverlay(currentVariant().kid ? 'Super gemacht! ⭐' : 'Gelöst! 🎉', 'Zeit: ' + fmtTime(state.seconds), [
          { label: 'Neues Spiel', primary: true, onClick: function () { startNewGame(state.variant); } }
        ]);
      } else if (state.over) {
        showOverlay('Game Over', 'Du hast ' + state.maxMistakes + ' Fehler gemacht.', [
          { label: 'Neues Spiel', primary: true, onClick: function () { startNewGame(state.variant); } },
          { label: 'Weiterspielen', onClick: function () {
              state.over = false; state.mistakes = 0; hideOverlay(); save(); render();
            } }
        ]);
      } else {
        startTimer();
      }
    } else {
      startNewGame('mittel');
    }
  })();
})();
</script>
</body>
</html>
